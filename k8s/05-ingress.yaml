# Requires an active Ingress controller (Traefik in this lab).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: kindcart
spec:
  ingressClassName: traefik
  rules:
    - host: shop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shop-api
                port: {number: 4000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-web
                port: {number: 3000}
