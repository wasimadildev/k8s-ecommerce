apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: kindcart
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop-web}
  template:
    metadata:
      labels: {app: shop-web}
    spec:
      containers:
        - name: web
          image: kindcart-web:v2
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          env:
            - name: API_INTERNAL_URL
              valueFrom:
                configMapKeyRef: {name: shop-config, key: API_INTERNAL_URL}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: kindcart
spec:
  type: ClusterIP
  selector: {app: shop-web}
  ports:
    - port: 3000
      targetPort: 3000
