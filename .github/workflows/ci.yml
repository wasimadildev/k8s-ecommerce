name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            directory: api
            build: false
          - name: web
            directory: web
            build: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Check API source
        if: matrix.name == 'api'
        working-directory: ${{ matrix.directory }}
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 |
            xargs -0 -n1 node --check

      - name: Build web application
        if: matrix.build
        working-directory: ${{ matrix.directory }}
        run: npm run build

  publish-images:
    name: Publish Docker images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-api
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-web
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-api:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kindcart-api
          cache-to: type=gha,mode=max,scope=kindcart-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-web:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kindcart-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=kindcart-web
          cache-to: type=gha,mode=max,scope=kindcart-web
